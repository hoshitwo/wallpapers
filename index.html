<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.json">
    <title>WALLPAPERS</title>
    <link rel="stylesheet" href="css/style.css?v=60">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&family=Share+Tech&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Loading Screen (初期) -->
    <div class="loader" id="loader">
        <span class="loader-logo">WALLPAPERS</span>
    </div>

    <!-- Loading Spinner (画像切替時) -->
    <div class="spinner hidden" id="spinner">
        <div class="spinner-ring"></div>
    </div>

    <!-- Background Wallpaper -->
    <div class="wallpaper" id="wallpaper"></div>
    <div class="wallpaper wallpaper-next" id="wallpaper-next"></div>

    <!-- Overlay Gradient -->
    <div class="overlay"></div>

    <!-- Filter Modal -->
    <div class="filter-modal hidden" id="filter-modal">
        <div class="filter-backdrop" id="filter-backdrop"></div>
        <div class="filter-panel">
            <div class="filter-header">
                <h2 class="filter-title">Source</h2>
            </div>
            <div class="filter-content">
                <!-- Unsplash -->
                <label class="filter-item">
                    <input type="checkbox" id="filter-unsplash" checked>
                    <span class="filter-checkbox"></span>
                    <span class="filter-label">Unsplash</span>
                </label>
                
                <!-- Pixabay -->
                <label class="filter-item">
                    <input type="checkbox" id="filter-pixabay" checked>
                    <span class="filter-checkbox"></span>
                    <span class="filter-label">Pixabay</span>
                </label>
                
                <!-- Pixabay Categories (全20種) -->
                <div class="filter-categories" id="filter-categories">
                    <label class="filter-item filter-sub">
                        <input type="checkbox" data-category="animals" checked>
                        <span class="filter-checkbox"></span>
                        <span class="filter-label">animals</span>
                    </label>
                    <label class="filter-item filter-sub">
                        <input type="checkbox" data-category="backgrounds" checked>
                        <span class="filter-checkbox"></span>
                        <span class="filter-label">backgrounds</span>
                    </label>
                    <label class="filter-item filter-sub">
                        <input type="checkbox" data-category="buildings" checked>
                        <span class="filter-checkbox"></span>
                        <span class="filter-label">buildings</span>
                    </label>
                    <label class="filter-item filter-sub">
                        <input type="checkbox" data-category="business" checked>
                        <span class="filter-checkbox"></span>
                        <span class="filter-label">business</span>
                    </label>
                    <label class="filter-item filter-sub">
                        <input type="checkbox" data-category="computer" checked>
                        <span class="filter-checkbox"></span>
                        <span class="filter-label">computer</span>
                    </label>
                    <label class="filter-item filter-sub">
                        <input type="checkbox" data-category="education" checked>
                        <span class="filter-checkbox"></span>
                        <span class="filter-label">education</span>
                    </label>
                    <label class="filter-item filter-sub">
                        <input type="checkbox" data-category="fashion" checked>
                        <span class="filter-checkbox"></span>
                        <span class="filter-label">fashion</span>
                    </label>
                    <label class="filter-item filter-sub">
                        <input type="checkbox" data-category="feelings" checked>
                        <span class="filter-checkbox"></span>
                        <span class="filter-label">feelings</span>
                    </label>
                    <label class="filter-item filter-sub">
                        <input type="checkbox" data-category="food" checked>
                        <span class="filter-checkbox"></span>
                        <span class="filter-label">food</span>
                    </label>
                    <label class="filter-item filter-sub">
                        <input type="checkbox" data-category="health" checked>
                        <span class="filter-checkbox"></span>
                        <span class="filter-label">health</span>
                    </label>
                    <label class="filter-item filter-sub">
                        <input type="checkbox" data-category="industry" checked>
                        <span class="filter-checkbox"></span>
                        <span class="filter-label">industry</span>
                    </label>
                    <label class="filter-item filter-sub">
                        <input type="checkbox" data-category="music" checked>
                        <span class="filter-checkbox"></span>
                        <span class="filter-label">music</span>
                    </label>
                    <label class="filter-item filter-sub">
                        <input type="checkbox" data-category="nature" checked>
                        <span class="filter-checkbox"></span>
                        <span class="filter-label">nature</span>
                    </label>
                    <label class="filter-item filter-sub">
                        <input type="checkbox" data-category="people" checked>
                        <span class="filter-checkbox"></span>
                        <span class="filter-label">people</span>
                    </label>
                    <label class="filter-item filter-sub">
                        <input type="checkbox" data-category="places" checked>
                        <span class="filter-checkbox"></span>
                        <span class="filter-label">places</span>
                    </label>
                    <label class="filter-item filter-sub">
                        <input type="checkbox" data-category="religion" checked>
                        <span class="filter-checkbox"></span>
                        <span class="filter-label">religion</span>
                    </label>
                    <label class="filter-item filter-sub">
                        <input type="checkbox" data-category="science" checked>
                        <span class="filter-checkbox"></span>
                        <span class="filter-label">science</span>
                    </label>
                    <label class="filter-item filter-sub">
                        <input type="checkbox" data-category="sports" checked>
                        <span class="filter-checkbox"></span>
                        <span class="filter-label">sports</span>
                    </label>
                    <label class="filter-item filter-sub">
                        <input type="checkbox" data-category="transportation" checked>
                        <span class="filter-checkbox"></span>
                        <span class="filter-label">transportation</span>
                    </label>
                    <label class="filter-item filter-sub">
                        <input type="checkbox" data-category="travel" checked>
                        <span class="filter-checkbox"></span>
                        <span class="filter-label">travel</span>
                    </label>
                </div>
            </div>
            <div class="filter-footer">
                <button class="btn-cancel" id="btn-cancel">Cancel</button>
                <button class="btn-save" id="btn-save">Save</button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="content">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <span class="logo-text">WALLPAPERS</span>
            </div>
            <div class="source-area">
                <div class="source">
                    <span class="source-name">Pixabay</span>
                    <span class="source-category"></span>
                </div>
                <button class="btn-filter" id="btn-filter" aria-label="フィルター">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 6h18M7 12h10M10 18h4"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Controls -->
        <nav class="controls">
            <button class="btn btn-prev" id="btn-prev" aria-label="前の画像">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M15 18l-6-6 6-6"/>
                </svg>
            </button>

            <button class="btn btn-share" id="btn-share" aria-label="共有">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8M16 6l-4-4-4 4M12 2v13"/>
                </svg>
            </button>

            <button class="btn btn-next" id="btn-next" aria-label="次の画像">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 18l6-6-6-6"/>
                </svg>
            </button>
        </nav>

        <!-- Hint -->
        <div class="hint">
            <kbd>←</kbd> <kbd>→</kbd> で移動 <kbd>S</kbd> で共有
        </div>
    </main>

    <script src="js/main.js?v=60"></script>
</body>
</html>
